spring:
  application:
    name: academy-management

  datasource:
    url: jdbc:mysql://localhost:3306/academy_management
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true